<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffefb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Devoirs" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Devoirs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f3d9c'/%3E%3Crect x='14' y='12' width='36' height='20' rx='3' fill='%23fffefb'/%3E%3Cpath d='M20 24h24' stroke='%232f3d9c' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M14 44h36M14 52h36' stroke='%23fffefb' stroke-opacity='.45' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Applique le thème avant le premier affichage pour éviter un flash
      try {
        var s = JSON.parse(localStorage.getItem('devoirs:settings') || '{}')
        var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
        var r = document.documentElement
        r.dataset.theme = dark ? 'dark' : 'light'
        r.dataset.accent = s.accent || 'indigo'
        r.dataset.size = s.textSize === 'large' ? 'large' : 'normal'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
